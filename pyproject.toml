[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topopt"
version = "0.1.0"
description = "Topology optimization via lattice Boltzmann"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "matplotlib",
    "lbm @ git+https://github.com/r-i-p-dance/lbm-2d-python.git@main",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["topopt*"]